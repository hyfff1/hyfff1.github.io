<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库问答 Agent · Demo</title>
<style>
  :root{--bg:#f6f5f2;--surface:#fff;--ink:#171717;--muted:#5f5f5c;--line:#e4e1da;--accent:#e5484d;--mono:"SF Mono",Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;letter-spacing:0}
  .wrap{max-width:960px;margin:0 auto;padding:48px 22px 72px}
  .back{font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--ink)}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,6vw,52px);line-height:1.05;margin:20px 0 8px;font-weight:400;letter-spacing:-0.02em}
  .sub{color:var(--muted);margin:0 0 32px;font-size:15px}
  .panel{background:var(--surface);border:1px solid var(--line);padding:20px;margin-bottom:20px;border-top:3px solid var(--ink)}
  label{display:block;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:8px}
  textarea,input{width:100%;font:14px/1.5 var(--sans);border:1px solid var(--line);border-radius:6px;padding:11px 12px;background:#fff;color:var(--ink)}
  textarea{min-height:170px;resize:vertical}
  .row{display:flex;gap:10px;margin-top:12px}
  .row input{flex:1}
  button{cursor:pointer;border:0;border-radius:6px;padding:11px 16px;font-weight:600;font-size:14px}
  .run{background:var(--ink);color:#fff}
  .run:hover{background:#000}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .hit{border:1px solid var(--line);padding:14px;margin-bottom:12px}
  .hit .score{font-family:var(--mono);font-size:11px;color:var(--accent)}
  .hit p{margin:8px 0 0;font-size:14px;color:var(--muted)}
  mark{background:#fbecec;color:#c43a40;padding:0 2px}
  .note{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← 返回主页</a>
  <h1>知识库问答 Agent</h1>
  <p class="sub">上传或粘贴文档，用自然语言提问，返回最相关的原文片段（检索式 Demo）。</p>

  <div class="panel">
    <label for="docs">知识库文档（空行分隔不同文档）</label>
    <textarea id="docs" spellcheck="false"></textarea>
    <div class="row">
      <input id="q" placeholder="例如：什么是 Agent 工作流？" />
      <button class="run" id="run">检索</button>
    </div>
    <div class="row">
      <button class="ghost" id="sample">加载示例文档</button>
    </div>
  </div>

  <div class="panel" id="out" style="display:none">
    <h2>检索结果</h2>
    <div id="hits"></div>
  </div>

  <p class="note">说明：这里演示 RAG 的「检索」环节，用 TF-IDF 相似度匹配原文；真实版本会再把命中文段交给大模型生成带来源的回答。</p>
</div>
<script>
const sampleDocs = `数据分析
数据分析是从原始数据中发现规律并支持决策的过程。常见步骤包括数据收集、清洗、探索性分析和可视化。SQL 和 Excel 是常用的数据分析工具。

Agent 工作流
Agent 工作流是指让 AI 代理按照计划调用工具、观察结果并迭代完成任务。常见环节包括理解目标、生成计划、调用工具、检查结果和总结输出。

提示工程
提示工程是设计输入指令以引导大模型输出预期结果的方法。好的提示通常包含角色、任务、约束、输出格式和示例。

RAG
RAG（检索增强生成）先根据问题从知识库检索相关文段，再把文段交给大模型生成答案，从而减少幻觉并保留来源。`;

const docs = document.getElementById("docs");
const q = document.getElementById("q");
document.getElementById("sample").onclick = () => { docs.value = sampleDocs; };

function tokenize(text){
  const lower = text.toLowerCase();
  const tokens = [];
  const words = lower.match(/[a-z0-9]+/g) || [];
  words.forEach(w=>tokens.push(w));
  const cjk = lower.replace(/[^\u4e00-\u9fff]/g, "");
  for(let i=0;i<cjk.length;i++){
    tokens.push(cjk[i]);
    if(i<cjk.length-1) tokens.push(cjk.slice(i,i+2));
  }
  return tokens;
}

function chunkPassages(text){
  const docsArr = text.split(/\n\s*\n/).filter(s=>s.trim());
  const chunks = [];
  docsArr.forEach(doc=>{
    const lines = doc.split(/\n/).filter(s=>s.trim());
    if(lines.length>1){
      const title = lines[0].trim();
      const body = lines.slice(1).join("\n");
      const sentences = body.split(/(?<=[。！？.!?])/);
      for(let i=0;i<sentences.length;i+=2){
        chunks.push({title, text: sentences.slice(i,i+2).join("").trim()});
      }
    } else {
      chunks.push({title:"", text: lines[0].trim()});
    }
  });
  return chunks;
}

function search(){
  const chunks = chunkPassages(docs.value);
  const query = q.value.trim();
  if(!chunks.length || !query){ return; }
  const qTokens = tokenize(query);
  const tokenized = chunks.map(c=>tokenize(c.text));
  const df = {};
  qTokens.forEach(t=>{
    if(df[t]===undefined){
      df[t] = tokenized.filter(tokens=>tokens.includes(t)).length;
    }
  });
  const N = chunks.length;
  const scored = chunks.map((c,i)=>{
    const tf = {};
    tokenized[i].forEach(t=>tf[t]=(tf[t]||0)+1);
    let score = 0;
    qTokens.forEach(t=>{
      if(!tf[t]) return;
      const idf = Math.log((N+1)/((df[t]||0)+1))+1;
      score += idf * (1 + Math.log(tf[t]));
    });
    return {chunk:c, score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,3);

  const qSet = new Set(qTokens);
  const html = scored.map(({chunk, score}, idx)=>{
    const text = escapeHtml(chunk.text);
    const marked = text.replace(/([a-z0-9]+|[\u4e00-\u9fff])/g, (m)=>{
      return qSet.has(m.toLowerCase()) ? "<mark>"+m+"</mark>" : m;
    });
    return "<div class='hit'><span class='score'>"+(idx+1)+" · 相关度 "+(Math.round(score*100)/100)+"</span><p>"+marked+"</p></div>";
  }).join("");
  document.getElementById("hits").innerHTML = html || "<p>没有找到相关片段。</p>";
  document.getElementById("out").style.display = "block";
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

document.getElementById("run").onclick = search;
q.addEventListener("keydown", e=>{ if(e.key==="Enter") search(); });
docs.value = sampleDocs;
q.value = "什么是 Agent 工作流";
search();
</script>
</body>
</html>
